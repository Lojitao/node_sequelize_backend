version: '3'
services:
  # MySQL 服務
  mysql: # 服務名稱
    image: mysql:8.3.0
    container_name: mysql_container_prod
    env_file:
      - .env.production
    command:
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
    environment:
      MYSQL_LOWER_CASE_TABLE_NAMES: 0
    ports:
      - "3307:3306"
    volumes:
      - ./data/mysql-prod:/var/lib/mysql
    networks:
      - web

  # Node.js 服務
  app: # 服務名稱
    build: .
    container_name: node_container_prod
    env_file:
      - .env.production
    ports:
      - "3010:3039"
    volumes:
      - .:/usr/src/app #沒有這行無法執行npx sequelize-cli db:migrate
      - /usr/src/app/node_modules  # 保留容器內的 node_modules
    depends_on:
      - mysql
    command: sh -c "sleep 5 && npm start" 
    networks:
      - web

networks:
  web:
    #driver: bridge
    external: true  # 確保該網絡是外部的，以便 Nginx 可以與 Node.js 進行通信

