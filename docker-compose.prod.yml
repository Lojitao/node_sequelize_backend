version: '3'
services:
  # MySQL 服務
  mysql:
    image: mysql:8.3.0
    container_name: mysql_container_prod
    env_file:
      - .env.production
    command:
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
    environment:
      # MYSQL_ROOT_PASSWORD: tao821028  # 設定 root 密碼
      # MYSQL_DATABASE: my_blog_prod  # 如果需要，也可以指定資料庫名稱
      MYSQL_LOWER_CASE_TABLE_NAMES: 0
    ports:
      - "3307:3306"
    volumes:
      - ./data/mysql-prod:/var/lib/mysql
    networks:
      - web

  # Node.js 服務
  app:
    build: .
    container_name: node_container_prod
    env_file:
      - .env.production
    ports:
      - "3010:3039"
    # volumes:
    #   - .:/usr/src/app  # 保證本地代碼與容器同步
    #   - /usr/src/app/node_modules  # 防止容器內的 node_modules 覆蓋本地的
    depends_on:
      - mysql
    command: sh -c "sleep 5 && npm start" 
    networks:
      - web

networks:
  web:
    external: true  # 確保該網絡是外部的，以便 Nginx 可以與 MySQL 和 Node.js 進行通信